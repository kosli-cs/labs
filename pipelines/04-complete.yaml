name: Main workflow
on: [push, workflow_dispatch]
env: # Set the secret as an input
  docker_username: ${{ github.actor }} 
  docker_password: ${{ secrets.GITHUB_TOKEN }} #Nees to be set to be made available to the workflow
  APP_NAME: ${{ github.event.repository.name }}
  BUILD_NUMBER: ${{ github.run_number }}
  GIT_REPO: ${{ github.repository }}
  GIT_REPO_URL: ${{ github.event.repository.clone_url }}
  GIT_BRANCH: ${{ github.ref_name }}
  GIT_COMMIT: ${{ github.sha }}
  IMAGE: ${{ github.repository_owner }}/${{ github.event.repository.name }}
  BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
  KOSLI_API_TOKEN: ${{ secrets.KOSLI_API_TOKEN }}
  KOSLI_ORG: ${{ vars.KOSLI_ORG }}
  
jobs:
  Build:
    runs-on: ubuntu-latest
    container: gradle:6-jdk11
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7
      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version:
            2.54.0

      - name: Create/Update Flow
        run: |
          kosli create flow ${APP_NAME}-pipeline \
            --description "CI/CD pipeline for ${APP_NAME} application" \
            --use-empty-template

      - name: Begin Trail
        run: |
          kosli begin trail ${GIT_COMMIT} \
            --flow ${APP_NAME}-pipeline \
            --description "Build ${BUILD_NUMBER}: ${GIT_BRANCH}"      
      - name: Build application
        run: bash ci/build-app.sh
      - name: Attest application artifact
        run: |
          JAR_FILE=$(ls app/build/libs/app-*-all.jar)
          kosli attest artifact ${JAR_FILE} \
            --artifact-type file \
            --flow ${APP_NAME}-pipeline \
            --trail ${GIT_COMMIT} \
            --name application \
            --build-url ${BUILD_URL} \
            --commit-url ${COMMIT_URL}
      - name: Test
        run: bash ci/unit-test-app.sh
      - name: Attest JUnit test results
        run: |
          kosli attest junit \
            --flow ${APP_NAME}-pipeline \
            --trail ${GIT_COMMIT} \
            --name application.unit-tests \
            --results-dir app/build/test-results/test/
      - name: Upload repo
        uses: actions/upload-artifact@v7
        with: 
          name: code
          path: .
          include-hidden-files: true
  Linting:
    runs-on: ubuntu-latest
    needs: [Build]
    steps:
      - name: Download code
        uses: actions/download-artifact@v8
        with:
          name: code
          path: .
      - name: run linting
        uses: super-linter/super-linter/slim@v9
        env:
          DEFAULT_BRANCH: main
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          DISABLE_ERRORS: true 
  Docker-image:
    runs-on: ubuntu-latest
    needs: [Build]
    permissions:
      packages: write
    steps:
    - name: Download code
      uses: actions/download-artifact@v8
      with:
        name: code
        path: .
    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: build docker
      run: bash ci/build-docker.sh
    - name: push docker
      run: bash ci/push-docker.sh
    - name: Setup Kosli CLI
      uses: kosli-dev/setup-cli-action@v5
      with:
        version:
          2.54.0
    - name: Attest Docker image
      run: |
        IMAGE_NAME="ghcr.io/${IMAGE}:latest"
        kosli attest artifact ${IMAGE_NAME} \
          --artifact-type oci \
          --flow ${APP_NAME}-pipeline \
          --trail ${GIT_COMMIT} \
          --name docker-image \
          --build-url ${BUILD_URL} \
          --commit-url ${COMMIT_URL} \
          --registry-username  ${{ github.actor }} \
          --registry-password ${{ secrets.GITHUB_TOKEN }}

    - name: Generate SBOM for the docker image
      uses: anchore/sbom-action@v0
      with:
        image: ghcr.io/${{ env.IMAGE }}:latest
        format: 'spdx-json'
        output-file: 'sbom.spdx.json'
        upload-artifact: false

  Security-scan:
    runs-on: ubuntu-latest
    needs: Docker-image
    steps:
    - name: Download code
      uses: actions/download-artifact@v8
      with:
        name: code
        path: .
    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: 'ghcr.io/${{ env.IMAGE }}:latest'
        format: 'json'
        output: 'trivy-results.json'
        #exit-code: '1' #Defaults to 0 meaning that the action will not fail the build if vulnerabilities are found
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
    - name: Setup Kosli CLI
      uses: kosli-dev/setup-cli-action@v5
      with:
        version:
          2.54.0
    - name: Attest vulnerability scan
      run: |
        IMAGE_NAME="ghcr.io/${IMAGE}:latest"
        kosli attest generic \
          --flow ${APP_NAME}-pipeline \
          --trail ${GIT_COMMIT} \
          --name docker-image.security-scan \
          --artifact-type oci ${IMAGE_NAME} \
          --compliant=true \
          --description "Trivy vulnerability scan" \
          --attachments trivy-results.json \
          --annotate scan_tool=trivy \
          --registry-username ${{ github.actor }} \
          --registry-password ${{ secrets.GITHUB_TOKEN }}
  Component-test:
    runs-on: ubuntu-latest
    needs: Docker-image
    steps:
    - name: Download code
      uses: actions/download-artifact@v8
      with:
        name: code
        path: .
    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Execute component test
      run: bash ci/component-test.sh
  Performance-test:
    runs-on: ubuntu-latest
    needs: Docker-image
    steps:
    - name: Download code
      uses: actions/download-artifact@v8
      with:
        name: code
        path: .
    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Execute performance test
      run: bash ci/performance-test.sh     
  Controls:
    runs-on: ubuntu-latest
    needs: [Build, Security-scan]
    steps:
    - name: Setup Kosli CLI
      uses: kosli-dev/setup-cli-action@v5
      with:
        version:
          2.54.0
    - name: Fingerprint Docker image
      run: |
        FINGERPRINT=$(kosli fingerprint ghcr.io/${IMAGE}:latest \
          --artifact-type oci \
          --registry-username ${{ github.actor }} \
          --registry-password ${{ secrets.GITHUB_TOKEN }})
        echo "FINGERPRINT=${FINGERPRINT}" >> $GITHUB_ENV
    - name: Decide LAB-001 Quality assurance
      run: |
        kosli evaluate policy \
          --context trail=${APP_NAME}-pipeline/${GIT_COMMIT} \
          --identifier attestation-compliant \
          --params '{"artifact": "application", "attestation": "unit-tests"}' \
          --control LAB-001 \
          --flow ${APP_NAME}-pipeline \
          --trail ${GIT_COMMIT} \
          --fingerprint ${FINGERPRINT}
    - name: Decide LAB-002 Vulnerability scanning
      run: |
        kosli evaluate policy \
          --context trail=${APP_NAME}-pipeline/${GIT_COMMIT} \
          --identifier attestation-compliant \
          --params '{"artifact": "docker-image", "attestation": "security-scan"}' \
          --control LAB-002 \
          --flow ${APP_NAME}-pipeline \
          --trail ${GIT_COMMIT} \
          --fingerprint ${FINGERPRINT}
  Deploy:
    runs-on: ubuntu-latest
    needs: [Docker-image, Security-scan, Component-test, Performance-test, Controls]
    steps:
    - name: Download code
      uses: actions/download-artifact@v8
      with:
        name: code 
        path: .
    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Deploy to production
      run: bash ci/start-application.sh
    - name: stop production environment
      run: bash ci/stop-application.sh